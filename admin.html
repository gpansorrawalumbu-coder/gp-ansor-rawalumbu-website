<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin GP Ansor</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html"><img src="assets/logo-gp-ansor.png" onerror="this.src='assets/logo-placeholder.svg'"><span><b>ADMIN</b><small>GP ANSOR RAWALUMBU</small></span></a><a href="index.html">← Website</a></header><main class="admin"><div id="login"><h1>Login Admin</h1><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Password"><button class="btn" onclick="login()">Masuk</button><p id="msg"></p></div><div id="panel" style="display:none"><h1>Dashboard Admin</h1><p>Kelola berita dan agenda dari HP. Data tersimpan online.</p><section class="box"><h2>Tambah Berita</h2><input id="title" placeholder="Judul"><input id="category" placeholder="Kategori"><textarea id="desc" placeholder="Isi singkat"></textarea><input id="image" type="file" accept="image/*"><button class="btn" onclick="saveNews()">Publikasikan</button></section><section class="box"><h2>Tambah Agenda</h2><input id="atitle" placeholder="Nama kegiatan"><input id="adate" type="date"><input id="aloc" placeholder="Lokasi"><button class="btn" onclick="saveAgenda()">Simpan Agenda</button></section><section class="box"><h2>Data Terbaru</h2><div id="list"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
